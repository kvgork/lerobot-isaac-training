repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: bash -c 'find packages -path "*/tests/test_*.py" -newer .git/COMMIT_EDITMSG 2>/dev/null | head -1 | xargs -r dirname | xargs -r -I{} bash -c "cd {} && python3 -m pytest -q --tb=no"'
        language: system
        pass_filenames: false
        stages: [pre-push]
