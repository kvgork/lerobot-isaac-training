[workspace]
name = "lerobot-isaac-training"
version = "0.1.0"
description = "Modular monorepo for LeRobot + Isaac Lab + LeWorldModel training (SO-101)"
authors = ["LeRobot Isaac Contributors"]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10,<3.13"
pip = "*"
pyyaml = "*"
# numpy / pyarrow / pandas / h5py: managed by pip (avoids conda RECORD-less numpy
# blocking pip uninstall when isaacsim/lerobot install their own pinned numpy)

[pypi-dependencies]
# Always-on workspace member. The 6 siblings come from feature.editable-siblings
# (default — develop-from-src/) unless an env explicitly uses feature.git-siblings
# (frozen-from-github, legacy reproducibility). Never include both in the same
# environment — pixi cannot resolve same package from two different URL sources.
lerobot-isaac-meta = { path = "packages/lerobot-isaac-meta", editable = true }

[feature.dev.dependencies]
pytest = "*"
ruff = "*"
hatchling = "*"

[feature.lerobot]
# Pip-install lerobot manually inside this env (gymnasium pin conflicts with sheeprl;
# cannot co-resolve via pixi). After `pixi install -e train-policy`, run:
#   bash scripts/install_train_deps.sh --policy
# (default extras: smolvla — set LEROBOT_EXTRAS=all to install all heavy extras).

[feature.realsense.pypi-dependencies]
pyrealsense2 = "*"

[feature.dreamerv3]
# Pip-install sheeprl manually after `pixi install -e train-dreamer`:
#   bash scripts/install_train_deps.sh --dreamer
# Notes:
#  - PyPI wheels pin `python<3.12`. The env is Python 3.12, so the helper
#    script installs from git master with `--ignore-requires-python`.
#  - Cannot co-install with lerobot here due to gymnasium version conflict.

[feature.leworldmodel]
# Pip-install lerobot manually after `pixi install -e train-lewm`:
#   bash scripts/install_train_deps.sh --lewm
# KNOWN GAP (2026-05-13): lerobot 0.5.x does NOT ship
# `lerobot.scripts.train_world_model`, so the `le_world_model` adapter target
# cannot dispatch a real training run today. Dry-run works. See
# docs/runbook/00-install.md §"Known training-backend gap: LeWorldModel".

[feature.isaaclab]
# Isaac Lab installed via its own setup script (NOT pip) — see scripts/install_isaac_lab.sh
# This feature exists to flag environments that should have Isaac Lab present.

[feature.dashboard.pypi-dependencies]
streamlit = ">=1.32"
streamlit-autorefresh = ">=1.0"   # avoids meta-refresh fallback that resets widgets
plotly = ">=5.20"
pandas = ">=2.1"
pyarrow = ">=15.0"
jinja2 = ">=3.1"
watchdog = ">=3.0"

# Default sibling install source (2026-05-21+): editable installs from src/.
# Workflow:
#   1. bash scripts/setup.sh -e <env>   # clones siblings into src/ if missing, then pixi install
#   2. edit src/<pkg>/...               # changes reflect immediately, no reinstall
#   3. cd src/<pkg> && git push         # publish from in-place dev clone
#
# Every standard environment includes this feature. The pre-install bootstrap
# (scripts/setup.sh → scripts/sync/sync_siblings.sh) ensures src/<name>/ exists
# before pixi resolves: local bare repo first, then https://github.com/kvgork/.
[feature.editable-siblings.pypi-dependencies]
lerobot-isaac-configs       = { path = "src/lerobot-isaac-configs",       editable = true }
lerobot-isaac-dashboard     = { path = "src/lerobot-isaac-dashboard",     editable = true }
lerobot-isaac-autoresearch  = { path = "src/lerobot-isaac-autoresearch",  editable = true }
lerobot-isaac-env           = { path = "src/lerobot-isaac-env",           editable = true }
lerobot-isaac-adapters      = { path = "src/lerobot-isaac-adapters",      editable = true }
lerobot-isaac-synthetic     = { path = "src/lerobot-isaac-synthetic",     editable = true }
lerobot-isaac-deploy        = { path = "src/lerobot-isaac-deploy",        editable = true }
robot-data-recorder         = { path = "src/robot-data-recorder",         editable = true }

# Legacy git-from-GitHub feature. Use for fresh-clone reproducibility checks
# (no local src/ deps). Activated by the `frozen` environment only. Default
# envs use feature.editable-siblings instead — see above.
[feature.git-siblings.pypi-dependencies]
lerobot-isaac-configs = { git = "https://github.com/kvgork/lerobot-isaac-configs.git", branch = "main" }
lerobot-isaac-dashboard = { git = "https://github.com/kvgork/lerobot-isaac-dashboard.git", branch = "main" }
lerobot-isaac-autoresearch = { git = "https://github.com/kvgork/lerobot-isaac-autoresearch.git", branch = "main" }
lerobot-isaac-env = { git = "https://github.com/kvgork/lerobot-isaac-env.git", branch = "main" }
lerobot-isaac-adapters = { git = "https://github.com/kvgork/lerobot-isaac-adapters.git", branch = "main" }
lerobot-isaac-synthetic = { git = "https://github.com/kvgork/lerobot-isaac-synthetic.git", branch = "main" }
lerobot-isaac-deploy = { git = "https://github.com/kvgork/lerobot-isaac-deploy.git", branch = "main" }

[environments]
# All standard envs use editable-siblings (develop in src/). Run setup.sh first
# to ensure src/ is populated before `pixi install` resolves.
default       = ["dev", "editable-siblings"]
train-policy  = ["dev", "lerobot", "editable-siblings"]
train-dreamer = ["dev", "lerobot", "dreamerv3", "editable-siblings"]
train-lewm    = ["dev", "lerobot", "leworldmodel", "editable-siblings"]
sim           = ["dev", "lerobot", "isaaclab", "editable-siblings"]
record        = ["dev", "lerobot", "realsense", "editable-siblings"]
full          = ["dev", "lerobot", "dreamerv3", "leworldmodel", "isaaclab", "realsense", "editable-siblings"]
dashboard     = ["dev", "dashboard", "editable-siblings"]

# Legacy: fresh-clone reproducibility check (no src/ deps; pulls from GitHub).
# Useful for verifying that the published GitHub branches still build.
frozen        = ["dev", "git-siblings"]
frozen-sim    = ["dev", "lerobot", "isaaclab", "git-siblings"]

[activation]
# Auto-export workspace env vars whenever a pixi shell or task is started.
# Mirrors `source scripts/setup_env.sh`.
scripts = ["scripts/setup_env.sh"]

[tasks]
# Meta owns the workspace-level tests. Each sibling package has its own CI in its
# GitHub repo (github.com/kvgork/<name>); their tests run there, not here.
test = "pytest packages/lerobot-isaac-meta/tests/"
lint = "ruff check packages/"
fmt = "ruff format packages/"
setup-env = "bash scripts/setup_env.sh"
batch = "lerobot-isaac-batch"
train-and-compare = "lerobot-isaac-batch --config src/lerobot-isaac-configs/src/lerobot_isaac_configs/configs/batches/example.yaml"
install-isaac-lab = "bash scripts/install_isaac_lab.sh"
install-train-deps = "bash scripts/install_train_deps.sh"
pipeline = "bash scripts/run_full_pipeline.sh"
autoresearch = "bash scripts/run_autoresearch.sh"
deploy = "robot-data-run"
deploy-check = "robot-data-run-check"
deploy-legacy = "lerobot-isaac-deploy"
download-usd = "bash src/lerobot-isaac-env/assets/usd/download_so101_urdf.sh"
record-dry-run = "lerobot-isaac-record --repo-id=local/test --num-episodes=1 --dry-run"
dashboard = "lerobot-isaac-dashboard"  # installed CLI entry point (was: streamlit run packages/lerobot-isaac-dashboard/...)
report = "python -m lerobot_isaac_dashboard.report --workspace ."
snapshot = "python -m lerobot_isaac_dashboard.snapshots --workspace ."
compare = "python -m lerobot_isaac_dashboard.compare --workspace ."

# --- Sibling-workflow tasks ------------------------------------------------
# Implementation lives in scripts/sync/*.sh and scripts/setup.sh.
# - setup         : canonical bootstrap = sync_siblings + pixi install
# - sync          : clone the 6 spinouts into src/<name>/ (idempotent, with GitHub fallback)
# - sync-update   : git fetch && git pull --ff-only on each src/lerobot-isaac-*
# - sync-recorder : opt-in clone of robot_data_recorder into src/robot-data-recorder
# - sync-runner   : opt-in clone of robot_data_runner sibling
# Siblings are cloned from GitHub (https://github.com/kvgork/<name>) by default.
# LEROBOT_SIBLINGS_GITHUB_BASE overrides the GitHub base.
# LEROBOT_SPINOUTS_BASE (optional) points at local bare repos for offline clones.
setup = "bash scripts/setup.sh"
sync = "bash scripts/sync/sync_siblings.sh"
sync-update = "bash scripts/sync/sync_update.sh"
sync-recorder = "bash scripts/sync/sync_recorder.sh"
sync-runner   = "bash scripts/sync/sync_runner.sh"
