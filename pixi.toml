[workspace]
name = "lerobot-isaac-training"
version = "0.1.0"
description = "Modular monorepo for LeRobot + Isaac Lab + LeWorldModel training (SO-101)"
authors = ["Koen van Gorkom <kvgorkom@smart-robotics.nl>"]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10,<3.13"
pip = "*"
pyyaml = "*"
# numpy / pyarrow / pandas / h5py: managed by pip (avoids conda RECORD-less numpy
# blocking pip uninstall when isaacsim/lerobot install their own pinned numpy)

[pypi-dependencies]
# Always-on workspace member. The 6 siblings live in feature.git-siblings (default
# env) OR feature.editable-siblings (opt-in editable env) — never both in the same
# environment (pixi can't resolve same package from two different URL sources).
lerobot-isaac-meta = { path = "packages/lerobot-isaac-meta", editable = true }

[feature.dev.dependencies]
pytest = "*"
ruff = "*"
hatchling = "*"

[feature.lerobot]
# Pip-install lerobot manually inside this env (gymnasium pin conflicts with sheeprl;
# cannot co-resolve via pixi). After `pixi install -e train-policy`, run:
#   bash scripts/install_train_deps.sh --policy
# (default extras: smolvla — set LEROBOT_EXTRAS=all to install all heavy extras).

[feature.realsense.pypi-dependencies]
pyrealsense2 = "*"

[feature.stable-worldmodel.pypi-dependencies]
stable-worldmodel = "*"

[feature.dreamerv3]
# Pip-install sheeprl manually after `pixi install -e train-dreamer`:
#   bash scripts/install_train_deps.sh --dreamer
# Notes:
#  - PyPI wheels pin `python<3.12`. The env is Python 3.12, so the helper
#    script installs from git master with `--ignore-requires-python`.
#  - Cannot co-install with lerobot here due to gymnasium version conflict.

[feature.leworldmodel]
# Pip-install lerobot manually after `pixi install -e train-lewm`:
#   bash scripts/install_train_deps.sh --lewm
# KNOWN GAP (2026-05-13): lerobot 0.5.x does NOT ship
# `lerobot.scripts.train_world_model`, so the `le_world_model` adapter target
# cannot dispatch a real training run today. Dry-run works. See
# docs/runbook/00-install.md §"Known training-backend gap: LeWorldModel".

[feature.isaaclab]
# Isaac Lab installed via its own setup script (NOT pip) — see scripts/install_isaac_lab.sh
# This feature exists to flag environments that should have Isaac Lab present.

[feature.dashboard.pypi-dependencies]
streamlit = ">=1.32"
streamlit-autorefresh = ">=1.0"   # avoids meta-refresh fallback that resets widgets
plotly = ">=5.20"
pandas = ">=2.1"
pyarrow = ">=15.0"
jinja2 = ">=3.1"
watchdog = ">=3.0"

# Default sibling install source: git+file:// against bare repos at
# ~/workspaces/spinouts/<name>/ (NO `.git` suffix — they are bare dirs whose
# `config` declares `bare = true`). Included in every "normal" environment.
# robot-data-recorder is intentionally NOT listed — standalone hardware package.
# TODO: swap file:// URLs for https://github.com/kvgork/<name>.git when published.
[feature.git-siblings.pypi-dependencies]
lerobot-isaac-configs = { git = "file:///home/koen/workspaces/spinouts/lerobot-isaac-configs", branch = "main" }
lerobot-isaac-dashboard = { git = "file:///home/koen/workspaces/spinouts/lerobot-isaac-dashboard", branch = "main" }
lerobot-isaac-autoresearch = { git = "file:///home/koen/workspaces/spinouts/lerobot-isaac-autoresearch", branch = "main" }
lerobot-isaac-env = { git = "file:///home/koen/workspaces/spinouts/lerobot-isaac-env", branch = "main" }
lerobot-isaac-adapters = { git = "file:///home/koen/workspaces/spinouts/lerobot-isaac-adapters", branch = "main" }
lerobot-isaac-synthetic = { git = "file:///home/koen/workspaces/spinouts/lerobot-isaac-synthetic", branch = "main" }

# Opt-in editable feature. Activated ONLY by the `editable` environment below
# (i.e. `pixi install -e editable`). When activated, the 6 sibling packages
# resolve from local clones at `src/<name>/` as editable path deps — INSTEAD
# of the git+file:// installs in feature.git-siblings (they are not co-included
# in the same environment, so there is no URL conflict).
#
# Workflow:
#   1. pixi run sync               # clones the 6 spinouts into src/
#   2. pixi install -e editable    # resolves with editable path deps
#   3. edit src/<pkg>/...          # changes reflect immediately, no reinstall
#
# Default `pixi install` is unaffected and keeps using git+file://.
[feature.editable-siblings.pypi-dependencies]
lerobot-isaac-configs       = { path = "src/lerobot-isaac-configs",       editable = true }
lerobot-isaac-dashboard     = { path = "src/lerobot-isaac-dashboard",     editable = true }
lerobot-isaac-autoresearch  = { path = "src/lerobot-isaac-autoresearch",  editable = true }
lerobot-isaac-env           = { path = "src/lerobot-isaac-env",           editable = true }
lerobot-isaac-adapters      = { path = "src/lerobot-isaac-adapters",      editable = true }
lerobot-isaac-synthetic     = { path = "src/lerobot-isaac-synthetic",     editable = true }

[environments]
default = ["dev", "git-siblings"]
train-policy = ["dev", "lerobot", "git-siblings"]
train-dreamer = ["dev", "lerobot", "dreamerv3", "git-siblings"]
train-lewm = ["dev", "lerobot", "leworldmodel", "git-siblings"]
sim = ["dev", "lerobot", "isaaclab", "git-siblings"]
record = ["dev", "lerobot", "realsense", "stable-worldmodel", "git-siblings"]
full = ["dev", "lerobot", "dreamerv3", "leworldmodel", "isaaclab", "realsense", "stable-worldmodel", "git-siblings"]
dashboard = ["dev", "dashboard", "git-siblings"]
editable = ["dev", "editable-siblings"]

[activation]
# Auto-export workspace env vars whenever a pixi shell or task is started.
# Mirrors `source scripts/setup_env.sh`.
scripts = ["scripts/setup_env.sh"]

[tasks]
# NOTE: archive/packages/lerobot-isaac-recorder/tests/ excluded — those tests import
# `robot_data_recorder`, which is no longer a workspace dep (recorder is standalone /
# opt-in via `pixi run sync-recorder` + manual pip install of src/robot-data-recorder/).
test = "pytest packages/lerobot-isaac-meta/tests/ archive/packages/*/tests/ --ignore-glob='archive/packages/lerobot-isaac-recorder/*'"
lint = "ruff check packages/ archive/packages/"
fmt = "ruff format packages/ archive/packages/"
setup-env = "bash scripts/setup_env.sh"
batch = "lerobot-isaac-batch"
train-and-compare = "lerobot-isaac-batch --config archive/packages/lerobot-isaac-configs/src/lerobot_isaac_configs/configs/batches/example.yaml"
install-isaac-lab = "bash scripts/install_isaac_lab.sh"
install-train-deps = "bash scripts/install_train_deps.sh"
download-usd = "bash archive/packages/lerobot-isaac-env/assets/usd/download_so101_urdf.sh"
record-dry-run = "lerobot-isaac-record --repo-id=local/test --num-episodes=1 --dry-run"
dashboard = "lerobot-isaac-dashboard"  # installed CLI entry point (was: streamlit run packages/lerobot-isaac-dashboard/...)
report = "python -m lerobot_isaac_dashboard.report --workspace ."
snapshot = "python -m lerobot_isaac_dashboard.snapshots --workspace ."
compare = "python -m lerobot_isaac_dashboard.compare --workspace ."

# --- Editable-siblings workflow tasks --------------------------------------
# Implementation lives in scripts/sync/*.sh (pixi tasks invoke them via bash).
# - sync          : clone the 6 spinouts into src/<name>/ (idempotent)
# - sync-update   : git fetch && git pull --ff-only on each src/lerobot-isaac-*
# - sync-recorder : opt-in clone of robot_data_recorder into src/robot-data-recorder
# LEROBOT_SPINOUTS_BASE overrides bare-repo location (default ~/workspaces/spinouts).
sync = "bash scripts/sync/sync_siblings.sh"
sync-update = "bash scripts/sync/sync_update.sh"
sync-recorder = "bash scripts/sync/sync_recorder.sh"
