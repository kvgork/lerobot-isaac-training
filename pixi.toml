[workspace]
name = "lerobot-isaac-training"
version = "0.1.0"
description = "Modular monorepo for LeRobot + Isaac Lab + LeWorldModel training (SO-101)"
authors = ["Koen van Gorkom <kvgorkom@smart-robotics.nl>"]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10,<3.13"
pip = "*"
pyyaml = "*"
# numpy / pyarrow / pandas / h5py: managed by pip (avoids conda RECORD-less numpy
# blocking pip uninstall when isaacsim/lerobot install their own pinned numpy)

[pypi-dependencies]
# Thin-meta-repo mode: only meta lives in packages/. The 6 siblings + recorder
# install from local bare repos (~/workspaces/spinouts/<name>.git) via git+file:// URLs.
# Meta itself is editable so monorepo dev workflow (cli.py + batch.py) still hot-reloads.
# TODO: swap file:// URLs for https://github.com/kvgork/<name>.git when repos are published.
lerobot-isaac-meta = { path = "packages/lerobot-isaac-meta", editable = true }
lerobot-isaac-configs = { git = "file:///home/koen/workspaces/spinouts/lerobot-isaac-configs.git", branch = "main" }
lerobot-isaac-dashboard = { git = "file:///home/koen/workspaces/spinouts/lerobot-isaac-dashboard.git", branch = "main" }
lerobot-isaac-autoresearch = { git = "file:///home/koen/workspaces/spinouts/lerobot-isaac-autoresearch.git", branch = "main" }
lerobot-isaac-env = { git = "file:///home/koen/workspaces/spinouts/lerobot-isaac-env.git", branch = "main" }
lerobot-isaac-adapters = { git = "file:///home/koen/workspaces/spinouts/lerobot-isaac-adapters.git", branch = "main" }
lerobot-isaac-synthetic = { git = "file:///home/koen/workspaces/spinouts/lerobot-isaac-synthetic.git", branch = "main" }
robot-data-recorder = { git = "file:///home/koen/workspaces/spinouts/robot-data-recorder.git", branch = "main" }

[feature.dev.dependencies]
pytest = "*"
ruff = "*"
hatchling = "*"

[feature.lerobot]
# Pip-install lerobot manually inside this env (gymnasium pin conflicts with sheeprl;
# cannot co-resolve via pixi). After `pixi shell -e train-policy`: pip install "lerobot[all]"

[feature.realsense.pypi-dependencies]
pyrealsense2 = "*"

[feature.stable-worldmodel.pypi-dependencies]
stable-worldmodel = "*"

[feature.dreamerv3]
# Pip-install sheeprl manually: pip install "sheeprl[dreamer]>=0.5"
# (Cannot co-install with lerobot due to gymnasium version conflict.)

[feature.leworldmodel]
# HF LeWorldModel installed via lerobot's extras or HF directly — pinned at install time

[feature.isaaclab]
# Isaac Lab installed via its own setup script (NOT pip) — see scripts/install_isaac_lab.sh
# This feature exists to flag environments that should have Isaac Lab present.

[feature.dashboard.pypi-dependencies]
streamlit = ">=1.32"
plotly = ">=5.20"
pandas = ">=2.1"
pyarrow = ">=15.0"
jinja2 = ">=3.1"
watchdog = ">=3.0"

[environments]
default = ["dev"]
train-policy = ["dev", "lerobot"]
train-dreamer = ["dev", "lerobot", "dreamerv3"]
train-lewm = ["dev", "lerobot", "leworldmodel"]
sim = ["dev", "lerobot", "isaaclab"]
record = ["dev", "lerobot", "realsense", "stable-worldmodel"]
full = ["dev", "lerobot", "dreamerv3", "leworldmodel", "isaaclab", "realsense", "stable-worldmodel"]
dashboard = ["dev", "dashboard"]

[activation]
# Auto-export workspace env vars whenever a pixi shell or task is started.
# Mirrors `source scripts/setup_env.sh`.
scripts = ["scripts/setup_env.sh"]

[tasks]
test = "pytest packages/lerobot-isaac-meta/tests/ archive/packages/*/tests/"
lint = "ruff check packages/ archive/packages/"
fmt = "ruff format packages/ archive/packages/"
setup-env = "bash scripts/setup_env.sh"
batch = "lerobot-isaac-batch"
train-and-compare = "lerobot-isaac-batch --config archive/packages/lerobot-isaac-configs/src/lerobot_isaac_configs/configs/batches/example.yaml"
install-isaac-lab = "bash scripts/install_isaac_lab.sh"
download-usd = "bash archive/packages/lerobot-isaac-env/assets/usd/download_so101_urdf.sh"
record-dry-run = "lerobot-isaac-record --repo-id=local/test --num-episodes=1 --dry-run"
dashboard = "lerobot-isaac-dashboard"  # installed CLI entry point (was: streamlit run packages/lerobot-isaac-dashboard/...)
report = "python -m lerobot_isaac_dashboard.report --workspace ."
snapshot = "python -m lerobot_isaac_dashboard.snapshots --workspace ."
compare = "python -m lerobot_isaac_dashboard.compare --workspace ."
