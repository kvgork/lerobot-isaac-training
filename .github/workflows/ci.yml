name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Per-package matrix jobs (6 packages, 2 Python versions each)
  package-tests:
    name: "pkg/${{ matrix.package }} / py${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - lerobot-isaac-adapters
          - lerobot-isaac-autoresearch
          - lerobot-isaac-configs
          - lerobot-isaac-env
          - lerobot-isaac-meta
          - lerobot-isaac-synthetic
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable) + test deps
        working-directory: packages/${{ matrix.package }}
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e . pytest ruff

      - name: Ruff lint
        working-directory: packages/${{ matrix.package }}
        run: |
          ruff check src/ tests/ || true

      - name: Run tests (no heavy deps)
        working-directory: packages/${{ matrix.package }}
        run: |
          python -m pytest tests/ \
            -m 'not requires_isaaclab and not requires_lerobot and not requires_dreamerv3' \
            --tb=short \
            -q

  # Workspace-level integration job using pixi
  workspace-integration:
    name: "workspace / pixi / integration"
    runs-on: ubuntu-latest
    needs: package-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Install workspace (default environment)
        run: pixi install

      - name: Ruff lint (all packages)
        run: |
          pixi run -e default python -m ruff check packages/*/src/ packages/*/tests/ || true

      - name: Run workspace-level tests (excluding integration)
        run: |
          pixi run -e default python -m pytest packages/*/tests/ \
            -m 'not integration' \
            --tb=short \
            -q
