name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Per-package matrix. Only lerobot-isaac-meta lives in this repo's packages/.
  # The sibling packages are standalone public repos (github.com/kvgork/<name>)
  # and run their own CI; they are not tested here.
  package-tests:
    name: "pkg/${{ matrix.package }} / py${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - lerobot-isaac-meta
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable) + test deps
        working-directory: packages/${{ matrix.package }}
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e . pytest ruff

      - name: Ruff lint
        working-directory: packages/${{ matrix.package }}
        run: |
          ruff check src/ tests/ || true

      - name: Run tests (no heavy deps)
        working-directory: packages/${{ matrix.package }}
        run: |
          python -m pytest tests/ \
            -m 'not requires_isaaclab and not requires_lerobot and not requires_dreamerv3' \
            --tb=short \
            -q

  # Workspace-level integration job using pixi
  workspace-integration:
    name: "workspace / pixi / integration"
    runs-on: ubuntu-latest
    needs: package-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      # The 'frozen' env pulls the sibling packages straight from their public
      # GitHub repos (git-siblings feature) — no local src/ clones needed, which
      # is the right fit for a clean CI runner.
      - name: Install workspace (frozen environment)
        run: pixi install -e frozen

      - name: Ruff lint (meta package)
        run: |
          pixi run -e frozen python -m ruff check packages/*/src/ packages/*/tests/ || true

      - name: Run workspace-level tests (excluding integration)
        run: |
          pixi run -e frozen python -m pytest packages/*/tests/ \
            -m 'not integration' \
            --tb=short \
            -q
