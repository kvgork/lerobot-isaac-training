[project]
name = "lerobot-isaac-synthetic"
version = "0.1.0"
description = "Synthetic data generation for LeRobot + Isaac Lab: domain-randomization replay and MimicGen bridge (deferred)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    # pyarrow / pandas are used for Parquet I/O — pulled in by lerobot at runtime
    # Isaac Lab is installed system-wide (not a pip dep)
    # lerobot is a soft import — not listed here to avoid mandatory install
    "pyarrow>=14.0",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_isaac_synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
