[project]
name = "lerobot-isaac-meta"
version = "0.1.0"
description = "Umbrella package for LeRobot + Isaac Lab training workspace (SO-101)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]
# NOTE: Sibling workspace packages are intentionally NOT in [project.dependencies].
#
# - In the monorepo/pixi workspace, siblings are installed as editable clones from
#   src/<name>/ (default/editable envs) or directly from GitHub (frozen envs) — see
#   the root pixi.toml [feature.editable-siblings] / [feature.git-siblings] tables.
#
# - For a plain pip install outside pixi, use the `post-spinout` extra to pull the
#   6 sibling repos from their public GitHub URLs:
#     pip install "lerobot-isaac-meta[post-spinout]"
#
# - Recorder (robot-data-recorder) is a standalone hardware-tier package and is NOT
#   pulled by any meta extras. Install it separately when needed.

[project.optional-dependencies]
# Pull the 6 sibling packages from their public GitHub repos:
#     pip install "lerobot-isaac-meta[post-spinout]"
post-spinout = [
  "lerobot-isaac-configs @ git+https://github.com/kvgork/lerobot-isaac-configs.git@main",
  "lerobot-isaac-dashboard @ git+https://github.com/kvgork/lerobot-isaac-dashboard.git@main",
  "lerobot-isaac-autoresearch @ git+https://github.com/kvgork/lerobot-isaac-autoresearch.git@main",
  "lerobot-isaac-env @ git+https://github.com/kvgork/lerobot-isaac-env.git@main",
  "lerobot-isaac-adapters @ git+https://github.com/kvgork/lerobot-isaac-adapters.git@main",
  "lerobot-isaac-synthetic @ git+https://github.com/kvgork/lerobot-isaac-synthetic.git@main",
]

[project.scripts]
lerobot-isaac = "lerobot_isaac_meta.cli:main"
lerobot-isaac-batch = "lerobot_isaac_meta.batch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_isaac_meta"]

[tool.hatch.metadata]
# Required because the post-spinout extra uses direct git+https:// URLs.
allow-direct-references = true


[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "requires_workspace_root: marks tests that require the monorepo workspace layout (sibling packages, workspace pyproject.toml). Auto-skipped when run from a standalone spun-out tree.",
]
