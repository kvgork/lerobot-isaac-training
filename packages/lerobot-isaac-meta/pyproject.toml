[project]
name = "lerobot-isaac-meta"
version = "0.1.0"
description = "Umbrella package for LeRobot + Isaac Lab training workspace (SO-101)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]
# NOTE: sibling workspace packages are NOT listed in [project] dependencies
# because pixi installs them as editable workspace deps via pypi-dependencies in
# root pixi.toml (avoids URL-conflict between plain name + editable path).
# Standalone post-spinout install: also pip install lerobot-isaac-{env,adapters,
# autoresearch,synthetic,configs,recorder} explicitly, OR use the [monorepo] extra.

[project.optional-dependencies]
monorepo = [
  "lerobot-isaac-env",
  "lerobot-isaac-adapters",
  "lerobot-isaac-autoresearch",
  "lerobot-isaac-synthetic",
  "lerobot-isaac-configs",
  "robot-data-recorder",
]

[project.scripts]
lerobot-isaac = "lerobot_isaac_meta.cli:main"
lerobot-isaac-batch = "lerobot_isaac_meta.batch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_isaac_meta"]

[tool.pytest.ini_options]
pythonpath = ["src"]
