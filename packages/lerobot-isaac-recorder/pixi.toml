# packages/robot-data-recorder/pixi.toml
#
# Active pixi env for the recorder package.
#
# Default env: lightweight — no hardware deps. Imports succeed via soft-import
# pattern (ADR-0003); tests use mocks. This is what `pixi install` in a spun-out
# tree (where the sibling lerobot/ path does not exist) will install.
#
# Hardware env: adds lerobot + pyrealsense2 + stable-worldmodel for real D435 +
# SO-101 sessions in `--format=dual` (Parquet + HDF5). Opt-in via:
#   pixi install -e hardware
#   pixi run -e hardware robot-data-record
#
# In monorepo mode the workspace-root pixi.toml installs the same hardware deps
# transparently. This package-local env is used when invoking from inside this
# directory or after spinout to a standalone repo.

[workspace]
name = "robot-data-recorder"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12"

[dependencies]
python = "3.12.*"
pip = "*"
numpy = "*"
h5py = "*"
pyyaml = "*"
# Torch via conda for CUDA compat (matches workspace root pixi.toml)
pytorch = ">=2.2.1,<2.8.0"
torchvision = ">=0.21.0,<0.23.0"
setuptools = ">=71,<81"
packaging = ">=24.2,<26.0"
# Cap fsspec to avoid pin conflict with datasets (lerobot transitive dep)
fsspec = "<=2025.9.0"

[pypi-dependencies]
robot-data-recorder = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = "*"
hatchling = "*"

# --- hardware feature ---------------------------------------------------------
# Opt-in deps for real D435 camera + SO-101 teleop + LeWM HDF5 writer.
# In a spun-out (standalone) tree the lerobot path will not resolve and
# this feature will be unusable until the user installs lerobot another way.
# Default env intentionally OMITS this so `pixi install` works in spinout.
[feature.hardware.dependencies]
pyrealsense2 = "*"

[feature.hardware.pypi-dependencies]
lerobot = { path = "../../../lerobot/src/lerobot", editable = true, extras = ["feetech", "intelrealsense"] }
stable-worldmodel = "*"

[environments]
default = ["dev"]
hardware = ["dev", "hardware"]
