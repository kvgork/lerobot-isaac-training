# Workspace umbrella — uv workspace definition (thin-meta-repo mode)
# See Section 11.4 of the build plan + ADR-0007 (thin-meta-repo).
# Only `lerobot-isaac-meta` is a workspace member in `packages/`. The sibling
# packages are published as standalone public repos at github.com/kvgork/<name>
# and are installed either as editable clones in src/ (default/editable envs) or
# directly from GitHub (frozen envs). This file is NOT installable itself.

[project]
name = "lerobot-isaac-workspace"
version = "0.1.0"
description = "Thin meta-repo for LeRobot + Isaac Lab + LeWorldModel training on SO-101"
requires-python = ">=3.10"

[tool.uv.workspace]
# Only meta is a live workspace member. Sibling packages live in their own public
# GitHub repos (github.com/kvgork/<name>) and, for local dev, as editable clones
# under src/<name>/ (git-ignored). They are not uv workspace members.
members = ["packages/lerobot-isaac-meta"]

[tool.uv.sources]
lerobot-isaac-meta = { workspace = true }

[tool.pytest.ini_options]
# Meta owns workspace-level tests. Sibling tests run in their own GitHub-repo CI.
testpaths = ["packages/lerobot-isaac-meta/tests"]
addopts = "--import-mode=importlib"
