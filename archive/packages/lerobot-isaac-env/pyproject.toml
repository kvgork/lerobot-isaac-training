[project]
name = "lerobot-isaac-env"
version = "0.1.0"
description = "Isaac Lab Manager-Based RL environment for the SO-101 manipulation arm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Isaac Lab is installed system-wide via pixi; not declared as a pip dep here.
    # torch is assumed present from the workspace environment.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_isaac_env"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
markers = [
    "requires_isaaclab: marks tests that require Isaac Lab to be installed (deselect with '-m not requires_isaaclab')",
]
