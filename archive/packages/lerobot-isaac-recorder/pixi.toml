# packages/robot-data-recorder/pixi.toml
#
# Active pixi env for the recorder package.
#
# Default env: lightweight — no hardware deps. Imports succeed via soft-import
# pattern (ADR-0003); tests use mocks. This is what `pixi install` in a spun-out
# tree (where the sibling lerobot/ path does not exist) will install.
#
# Hardware env: adds pyrealsense2 + stable-worldmodel for real D435 + LeWM HDF5
# writer. Opt-in via:
#   pixi install -e hardware
#   pixi run -e hardware robot-data-record
#
# lerobot is NOT declared here as a path-dep. Two reasons:
#   1. pixi canonicalizes all path-deps during a single solve, even for non-
#      default envs, so a hard-coded `../../../lerobot/src/lerobot` would fail
#      `pixi install` in any spun-out tree.
#   2. In monorepo mode the workspace-root pixi.toml owns the lerobot editable
#      install (see ../../pixi.toml [feature.lerobot]). The package-local
#      pixi.toml is dormant in monorepo mode per the workspace contract.
#
# For real SO-101 hardware use in a standalone (spun-out) tree, install lerobot
# separately after `pixi install -e hardware`:
#   pixi run -e hardware pip install "lerobot[feetech,intelrealsense]"
# or point at a local checkout:
#   pixi run -e hardware pip install -e /path/to/lerobot/src/lerobot

[workspace]
name = "robot-data-recorder"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12"

[dependencies]
python = "3.12.*"
pip = "*"
numpy = "*"
h5py = "*"
pyyaml = "*"
# Torch via conda for CUDA compat (matches workspace root pixi.toml)
pytorch = ">=2.2.1,<2.8.0"
torchvision = ">=0.21.0,<0.23.0"
setuptools = ">=71,<81"
packaging = ">=24.2,<26.0"
# Cap fsspec to avoid pin conflict with datasets (lerobot transitive dep)
fsspec = "<=2025.9.0"

[pypi-dependencies]
robot-data-recorder = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = "*"
hatchling = "*"

# --- hardware feature ---------------------------------------------------------
# Opt-in deps for real D435 camera + LeWM HDF5 writer.
# lerobot is intentionally not declared (see header). Install separately for
# real SO-101 sessions. Default env omits this entire feature so
# `pixi install` in a spun-out tree succeeds.
[feature.hardware.dependencies]
pyrealsense2 = "*"

[feature.hardware.pypi-dependencies]
stable-worldmodel = "*"

[environments]
default = ["dev"]
hardware = ["dev", "hardware"]
